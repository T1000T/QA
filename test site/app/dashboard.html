<!doctype html><html lang="en"><head><meta charset="utf-8"><title>InnovaCRM - Dashboard</title><link rel="stylesheet" href="style.css"><style>body{background:#f3f6fb}  .dash{width:min(1100px,92%);margin:35px auto}  .top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:22px 28px;border-radius:14px}  .nav{display:flex;gap:18px;align-items:center}  .nav a{color:#3767b4;text-decoration:none;font-weight:600}  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px}  .card{background:#fff;padding:25px;border-radius:14px}  .number{font-size:30px;font-weight:bold;margin-top:12px}  .logout{border:0;background:#b42318;color:white;padding:10px 15px;border-radius:8px;cursor:pointer}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="dash"><header class="top"><div><h2 id="welcome">Dashboard</h2><p id="role"></p></div><nav class="nav"><a href="dashboard.html">Dashboard</a><a href="index.html">Login</a><button id="logoutButton" class="logout">Logout</button></nav></header><section class="cards"><div class="card">Customers<div id="customerCount" class="number">128</div></div><div class="card">Pending Orders<div id="orderCount" class="number">17</div></div><div class="card">Revenue<div id="revenue" class="number">$42,850</div></div></section><section class="card" style="margin-top:18px"><h3>Recent activity</h3><p id="activity">No new activity.</p></section></main><script>(function(){const raw=localStorage.getItem("innovaSession")||sessionStorage.getItem("innovaSession");if(!raw){location.href="index.html";return}const s=JSON.parse(raw);welcome.textContent="Welcome, "+s.username;role.textContent="Role: "+s.role;logoutButton.onclick=()=>{localStorage.removeItem("innovaSession");sessionStorage.removeItem("innovaSession");location.href="index.html"}})()</script></body></html>
