<!doctype html><html lang="en"><head><meta charset="utf-8"><title>InnovaCRM - Sign In</title><link rel="stylesheet" href="style.css"></head><body>
<main class="auth-shell"><section class="brand-panel"><div class="logo">I</div><h1>InnovaCRM</h1><p>Customer relationship management made simple.</p><div class="feature-list"><span>✓ Secure authentication</span><span>✓ Customer management</span><span>✓ Business insights</span></div></section>
<section class="login-card"><div class="card-header"><h2>Welcome back</h2><p>Sign in to your account</p></div>
<form id="loginForm" novalidate><label for="username">Username</label><input id="username" name="username" type="text" autocomplete="username" placeholder="Enter your username">
<label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password"><button id="togglePassword" type="button" class="icon-button">Show</button></div>
<div class="options-row"><label class="checkbox-label"><input id="rememberMe" type="checkbox"><span>Remember me</span></label><button id="forgotPassword" type="button" class="link-button">Forgot password?</button></div>
<button id="loginButton" type="submit" class="primary-button">Sign in</button><div id="loginMessage" class="message" role="alert"></div></form>
<div class="demo-users"><strong>Demo accounts</strong><p>admin / Password123</p><p>user / UserPass123</p><p>locked / Locked123</p></div></section></main><script src="app.js"></script></body></html>
