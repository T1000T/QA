name: QA Automation Tests

on:
  push:
    branches:
      - main
      - qa
      - dev
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run'
        required: true
        default: 'Manual run'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine environment
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV=PROD" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "qa" ]]; then
            echo "ENV=QA" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "ENV=DEV" >> "$GITHUB_ENV"
          else
            echo "Unknown branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Run tests
        env:
          ENV: ${{ env.ENV }}
        run: |
          pytest -v -c automation/pytest.ini --html=test-$ENV/results/report.html --self-contained-html

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/$ENV/report.html
            test-results/$ENV/screenshots/